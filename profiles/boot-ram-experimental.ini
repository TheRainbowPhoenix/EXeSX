# Firmware-derived address extents; NOT a confirmed physical memory inventory.
# EXESX_MEMORY_PROFILE=/absolute/path/to/this/file
# Existing board: 0x61000000..0x61ffffff + 0x62000000..0x65ffffff.
# Here we supplement BIOS zero-init destinations without pretending to
# know an external chip type. Reserved holes remain unmapped.
[upper-backing-tail]
kind=ram
base=0x66000000
size=0x00d80000

[upper-region-one]
kind=ram
base=0x67100000
size=0x00500000

[upper-region-two]
kind=ram
base=0x67600000
size=0x00a00000
