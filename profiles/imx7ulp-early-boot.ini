# Evidence-backed i.MX7ULP early startup model.
# Peripheral addresses are confirmed from NXP MCUXpresso CMSIS SDK and
# U-Boot's imx7ulp.dtsi; only touched subsets of peripheral behavior modeled.
# EXESX_MEMORY_PROFILE=/absolute/path/profiles/imx7ulp-early-boot.ini
# The three additional RAM windows come from firmware MMU descriptors.
[ddr-upper-tail]
kind=ram
base=0x66000000
size=0x00d80000

[ddr-upper-one]
kind=ram
base=0x67100000
size=0x00500000

[ddr-upper-two]
kind=ram
base=0x67600000
size=0x00a00000

# PCC0_RGPIO2P0_CLKCFG and PCC0_PCTLA_CLKCFG; register CGC bit 30.
[pcc0-early-gates]
kind=imx7ulp-pcc
base=0x41026000
size=0x1000

# Port A standard GPIO output set/clear/toggle and direction registers.
[gpio-pta]
kind=imx7ulp-gpio
base=0x4100f000
size=0x40

# Port A pin control PCR0..PCR31 (partial register implementation).
[pctla]
kind=imx7ulp-pctl
base=0x4103d000
size=0x1000

# Time Stamp Timer B: free-running 64-bit counter in 1-MHz units.
[tstmr-b]
kind=imx7ulp-tstmr
base=0x410a3c08
size=0x8

# PCC2 clock-gate register kCLOCK_Flexbus at 0x403f0040.
[pcc2-flexbus]
kind=imx7ulp-pcc
base=0x403f0000
size=0x1000

# PCC1 peripheral domain and PCC3 application/display domain.
# Offsets are strictly limited to NXP fsl_clock.h registers in C module.
[pcc1]
kind=imx7ulp-pcc
base=0x410b2000
size=0x1000

[pcc3-application]
kind=imx7ulp-pcc
base=0x40b30000
size=0x1000

# NXP IOMUXC1 pin mux/pad/select-input. 0x40ac01c0 is PTF16 FB_AD28.
[iomuxc1]
kind=imx7ulp-iomuxc
base=0x40ac0000
size=0x1000

# NXP U-Boot DTS documents 0x40-byte GPIO register banks for B and C-F.
[gpio-ptb]
kind=imx7ulp-gpio
base=0x4100f040
size=0x40

[gpio-ptc]
kind=imx7ulp-gpio
base=0x400f0000
size=0x40

[gpio-ptd]
kind=imx7ulp-gpio
base=0x400f0040
size=0x40

[gpio-pte]
kind=imx7ulp-gpio
base=0x400f0080
size=0x40

[gpio-ptf]
kind=imx7ulp-gpio
base=0x400f00c0
size=0x40

# NXP FB peripheral: CSAR/CSMR/CSCR for chip selects 0-5, CSPMCR.
[flexbus-controller]
kind=imx7ulp-flexbus
base=0x40100000
size=0x1000

# SMC0 System Reset/Power status, NXP PERI_SMC.h.
[smc0]
kind=imx7ulp-smc
base=0x410a4000
size=0x100

# i.MX7ULP WDOG1 and WDOG2, NXP PERI_WDOG.h.
[wdog1]
kind=imx7ulp-wdog
base=0x403d0000
size=0x10

[wdog2]
kind=imx7ulp-wdog
base=0x40430000
size=0x10

# SIM0 general-purpose and SoC option registers, including DGO_GP7 (+0x70).
[sim0]
kind=imx7ulp-sim
base=0x410a3000
size=0x100

# i.MX7ULP A7 clock source: SCG1, firmware polls FIRC/SOSC/SPLL status.
# Models source enable -> ready and PFD fraction/gate -> PFD_VALID.
[scg1]
kind=imx7ulp-scg1
base=0x403e0000
size=0x1000

# TPM6/TPM7 counters (SC/CNT/MOD), i.MX7ULP MCIMX7U5 SDK.
[tpm6]
kind=imx7ulp-tpm
base=0x40a10000
size=0x100

[tpm7]
kind=imx7ulp-tpm
base=0x40a20000
size=0x100

# PMC1 A7-domain LDO and low power-mode configuration (NXP PERI_PMC1.h).
[pmc1]
kind=imx7ulp-pmc1
base=0x40400000
size=0x100
