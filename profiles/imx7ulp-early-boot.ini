# Evidence-backed i.MX7ULP early startup model.
# Peripheral addresses are confirmed from NXP MCUXpresso CMSIS SDK and
# U-Boot's imx7ulp.dtsi; only touched subsets of peripheral behavior modeled.
# EXESX_MEMORY_PROFILE=/absolute/path/profiles/imx7ulp-early-boot.ini
# The three additional RAM windows come from firmware MMU descriptors.
[ddr-upper-tail]
kind=ram
base=0x66000000
size=0x00d80000

[ddr-upper-one]
kind=ram
base=0x67100000
size=0x00500000

[ddr-upper-two]
kind=ram
base=0x67600000
size=0x00a00000

# PCC0_RGPIO2P0_CLKCFG and PCC0_PCTLA_CLKCFG; register CGC bit 30.
[pcc0-early-gates]
kind=imx7ulp-pcc
base=0x41026000
size=0x1000

# Port A standard GPIO output set/clear/toggle and direction registers.
[gpio-pta]
kind=imx7ulp-gpio
base=0x4100f000
size=0x40

# Port A pin control PCR0..PCR31 (partial register implementation).
[pctla]
kind=imx7ulp-pctl
base=0x4103d000
size=0x1000

# Time Stamp Timer B: free-running 64-bit counter in 1-MHz units.
[tstmr-b]
kind=imx7ulp-tstmr
base=0x410a3c08
size=0x8

# PCC2 clock-gate register kCLOCK_Flexbus at 0x403f0040.
[pcc2-flexbus]
kind=imx7ulp-pcc
base=0x403f0000
size=0x1000

# PCC1 peripheral domain and PCC3 application/display domain.
# Offsets are strictly limited to NXP fsl_clock.h registers in C module.
[pcc1]
kind=imx7ulp-pcc
base=0x410b2000
size=0x1000

[pcc3-application]
kind=imx7ulp-pcc
base=0x40b30000
size=0x1000

# NXP IOMUXC1 pin mux/pad/select-input. 0x40ac01c0 is PTF16 FB_AD28.
[iomuxc1]
kind=imx7ulp-iomuxc
base=0x40ac0000
size=0x1000

# NXP U-Boot DTS documents 0x40-byte GPIO register banks for B and C-F.
[gpio-ptb]
kind=imx7ulp-gpio
base=0x4100f040
size=0x40

[gpio-ptc]
kind=imx7ulp-gpio
base=0x400f0000
size=0x40

[gpio-ptd]
kind=imx7ulp-gpio
base=0x400f0040
size=0x40

[gpio-pte]
kind=imx7ulp-gpio
base=0x400f0080
size=0x40

[gpio-ptf]
kind=imx7ulp-gpio
base=0x400f00c0
size=0x40

# NXP FB peripheral: CSAR/CSMR/CSCR for chip selects 0-5, CSPMCR.
[flexbus-controller]
kind=imx7ulp-flexbus
base=0x40100000
size=0x1000

# SMC0 System Reset/Power status, NXP PERI_SMC.h.
[smc0]
kind=imx7ulp-smc
base=0x410a4000
size=0x100

# i.MX7ULP WDOG1 and WDOG2, NXP PERI_WDOG.h.
[wdog1]
kind=imx7ulp-wdog
base=0x403d0000
size=0x10

[wdog2]
kind=imx7ulp-wdog
base=0x40430000
size=0x10

# SIM0 general-purpose and SoC option registers, including DGO_GP7 (+0x70).
[sim0]
kind=imx7ulp-sim
base=0x410a3000
size=0x100

# i.MX7ULP A7 clock source: SCG1, firmware polls FIRC/SOSC/SPLL status.
# Models source enable -> ready and PFD fraction/gate -> PFD_VALID.
[scg1]
kind=imx7ulp-scg1
base=0x403e0000
size=0x1000

# TPM6/TPM7 counters (SC/CNT/MOD), i.MX7ULP MCIMX7U5 SDK.
[tpm6]
kind=imx7ulp-tpm
base=0x40a10000
size=0x100

[tpm7]
kind=imx7ulp-tpm
base=0x40a20000
size=0x100

# PMC1 A7-domain LDO and low power-mode configuration (NXP PERI_PMC1.h).
[pmc1]
kind=imx7ulp-pmc1
base=0x40400000
size=0x100

# PMC0 M4-domain power-mode controller, NXP PERI_PMC0.h.
[pmc0]
kind=imx7ulp-pmc0
base=0x410a1000
size=0x100

# PORT pin-control PCR[0..31], GPCLR/GPCHR, ISFR. GPIO data is separate.
[porta]
kind=imx7ulp-port
base=0x4103f000
size=0x100

[portb]
kind=imx7ulp-port
base=0x41040000
size=0x100

[portc]
kind=imx7ulp-port
base=0x40ae0000
size=0x100

[portd]
kind=imx7ulp-port
base=0x40af0000
size=0x100

[porte]
kind=imx7ulp-port
base=0x40b00000
size=0x100

[portf]
kind=imx7ulp-port
base=0x40b10000
size=0x100

# NXP LPIT0/LPIT1 low power interval timers.
[lpit1]
kind=imx7ulp-lpit
base=0x40270000
size=0x100

[lpit0]
kind=imx7ulp-lpit
base=0x4102d000
size=0x100

# Two NXP SEMA42 cross-domain hardware semaphore blocks.
[sema42-0]
kind=imx7ulp-sema42
base=0x4101b000
size=0x100

[sema42-1]
kind=imx7ulp-sema42
base=0x401b0000
size=0x100

# Cortex-A7 domain MSMC1. Same SMC_Type register map as MSMC0.
[smc1]
kind=imx7ulp-smc
base=0x40410000
size=0x100

# M4-domain System Clock Generator, NXP MCIMX7U5 SCG0_BASE.
# FIRC/SIRC initialized to pre-BIOS ROM handoff defaults in machine.
[scg0]
kind=imx7ulp-scg0
base=0x41027000
size=0x1000

# M4-domain TSTMRA, adjacent to the already modeled TSTMRB.
# NXP PERI_TSTMR.h / TSTMRA_BASE = 0x410a3c00.
[tstmr-a]
kind=imx7ulp-tstmr
base=0x410a3c00
size=0x8

# M4 real-time domain WDOG0. Same silicon WDOG_Type unlock sequence.
# NXP MCIMX7U5_cm4_COMMON.h: WDOG0_BASE = 0x41025000.
[wdog0]
kind=imx7ulp-wdog
base=0x41025000
size=0x10

# M4 low-power timer instances (NXP PERI_LPTMR.h, CSR/PSR/CMR/CNR).
[lptmr0]
kind=imx7ulp-lptmr
base=0x4102e000
size=0x10

[lptmr1]
kind=imx7ulp-lptmr
base=0x4102f000
size=0x10

# NXP TPM0 hardware timer
[tpm0]
kind=imx7ulp-tpm
base=0x41030000
size=0x100

# NXP TPM1 hardware timer
[tpm1]
kind=imx7ulp-tpm
base=0x41031000
size=0x100

# NXP TPM2 hardware timer
[tpm2]
kind=imx7ulp-tpm
base=0x410a8000
size=0x100

# NXP TPM3 hardware timer
[tpm3]
kind=imx7ulp-tpm
base=0x410a9000
size=0x100

# NXP TPM4 hardware timer
[tpm4]
kind=imx7ulp-tpm
base=0x40250000
size=0x100

# NXP TPM5 hardware timer
[tpm5]
kind=imx7ulp-tpm
base=0x40260000
size=0x100

# NXP i.MX7ULP MU v1 A/B pair: 4 TX/RX channels + doorbells.
[mua]
kind=imx7ulp-mu
base=0x41022000
size=0x100

[mub]
kind=imx7ulp-mu
base=0x40220000
size=0x100

# NXP LPI2C0 peripheral; no external slave until identified.
[lpi2c0]
kind=imx7ulp-lpi2c
base=0x41033000
size=0x200

# NXP LPI2C1 peripheral; no external slave until identified.
[lpi2c1]
kind=imx7ulp-lpi2c
base=0x41034000
size=0x200

# NXP LPI2C2 peripheral; no external slave until identified.
[lpi2c2]
kind=imx7ulp-lpi2c
base=0x41035000
size=0x200

# NXP LPI2C3 peripheral; no external slave until identified.
[lpi2c3]
kind=imx7ulp-lpi2c
base=0x41036000
size=0x200

# NXP ADC0/ADC1 analog-to-digital converter register banks.
# Both have real software register semantics, but no analog sensor attached.
[adc0]
kind=imx7ulp-adc
base=0x41041000
size=0x400

[adc1]
kind=imx7ulp-adc
base=0x410ad000
size=0x400
