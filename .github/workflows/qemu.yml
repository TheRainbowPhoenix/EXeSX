name: Build and smoke-test EXeSX QEMU
on:
  push:
    branches: [main, experiment/dy357-wlan-host-20261029]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Avoid compiling 3000 objects on superseded commits.
concurrency:
  group: exesx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JOBS: '4'
      CC: "ccache gcc"
      CXX: "ccache g++"
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 650M
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check original-ROM E2E runner
        run: python3 -m py_compile scripts/ci_e2e_arm_pattern.py scripts/ci_e2e_display_advanced.py
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3 ninja-build gcc g++ gdb ccache pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev
          python3 -m pip install --user --break-system-packages 'meson>=1.5,<2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore incremental compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: exesx-ccache-linux-x86_64-qemu-10.1.0-${{ github.sha }}
          restore-keys: |
            exesx-ccache-linux-x86_64-qemu-10.1.0-
      - name: Compile QEMU
        run: |
          ccache --zero-stats
          bash scripts/build.sh
          ccache --show-stats
      - name: Save compiled object cache before runtime tests
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: exesx-ccache-linux-x86_64-qemu-10.1.0-${{ github.sha }}
      - name: Preserve native emulator for debugging
        uses: actions/upload-artifact@v4
        with:
          name: exesx-compiler-output-${{ github.sha }}
          path: build/qemu-system-arm
          if-no-files-found: error
      - name: Build independent memory-access tracer plugin
        run: bash scripts/build_memtrace.sh
      - name: Check experimental runtime memory profile and CPU probe
        env:
          EXESX_MEMORY_PROFILE: ${{ github.workspace }}/profiles/boot-ram-experimental.ini
        run: |
          python3 scripts/make_probe.py build/cp15-probe.elf
          python3 scripts/test_qemu.py
      - name: Static checks for modular tools
        run: python3 -m py_compile scripts/analyze_init_regions.py scripts/make_gdb_commands.py scripts/fuzz_mmio.py scripts/recover_exesx.py scripts/analyze_lpi2c_trace.py scripts/probe_lpi2c4b.py scripts/prepare_i2c_ghidra.py scripts/decode_i2c_transactions.py scripts/i2c_boot_triage.py scripts/probe_gpio_ipc.py scripts/probe_i2c_register_mirror.py scripts/probe_i2c40_register_mirror.py scripts/probe_dma0.py scripts/analyze_a7_kernel_mu.py scripts/probe_mu_irq.py scripts/probe_mu_v1_channels.py scripts/probe_snvs_hp.py scripts/probe_a7_early_devices.py scripts/probe_usdhc1_no_media.py scripts/probe_upstream_emmc.py scripts/probe_usdhc1_clock_gate.py scripts/probe_snvs_hp_rtc.py scripts/probe_gpiob_input.py scripts/probe_a7_boot_gate.py scripts/probe_postdma_handoff.py scripts/probe_ipc_1808.py scripts/probe_ipc_0804.py scripts/probe_gpioa_live_input.py scripts/drive_factory_menu.py scripts/drive_physical_menu_qmp.py scripts/probe_factory_snapshot.py scripts/probe_lptmr_m4_irq.py scripts/probe_m4_key_matrix.py scripts/probe_m4_port_irq.py scripts/probe_m4_tpm0_irq.py scripts/drive_factory_menu.py scripts/drive_physical_menu_qmp.py scripts/probe_factory_snapshot.py scripts/probe_lptmr_m4_irq.py scripts/probe_m4_key_matrix.py scripts/probe_m4_port_irq.py scripts/probe_m4_tpm0_irq.py scripts/summarize_lcd_screenshot.py scripts/probe_lcd_landscape.py
          python3 scripts/fuzz_mmio.py --help
      - name: Check cold-start OSUP recovery launcher
        run: python3 scripts/recover_exesx.py --help
      - name: Confirm synthetic guest RAM reads/writes at both addresses
        run: |
          python3 scripts/probe_profile.py --qemu build/qemu-system-arm \
            --profile profiles/boot-ram-experimental.ini \
            --plugin build/exesx-memtrace.so
      - name: Test i.MX7ULP register behavior using real synthetic ARM instructions
        run: |
          python3 scripts/probe_imx7ulp.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify ADC0/ADC1 MMIO using real synthetic ARM instructions
        run: |
          python3 scripts/probe_adc.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Differential test of isolated I2C 0x40 register mirror with ARM guest
        run: |
          python3 scripts/probe_i2c40_register_mirror.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify NXP MU v1 channel-bit ordering, all four channels and acknowledgments
        run: |
          python3 scripts/probe_mu_v1_channels.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify real QEMU i.MX USDHC1 and TYPE_EMMC with synthetic 16GB card
        run: |
          python3 scripts/probe_upstream_emmc.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify root-clock absent does not pass Casio RSTA/SDSTB polling
        run: |
          python3 scripts/probe_usdhc1_clock_gate.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify empty USDHC1 eMMC slot times out CMD1 using ARM guest
        run: |
          python3 scripts/probe_usdhc1_no_media.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify SNVS HP RTC increments and freezes using real guest ARM
        run: |
          python3 scripts/probe_snvs_hp_rtc.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify GPIOB external input and output direction with real ARM instructions
        run: |
          python3 scripts/probe_gpiob_input.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify A7 early USDHC DMA1 DMAMUX1 and LPSPI2 ARM guest
        run: |
          python3 scripts/probe_a7_early_devices.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify LCD synthetic ARM framebuffer screenshot
        run: python3 scripts/probe_lcd_screenshot.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify DY357 landscape LCD MADCTL and centered window
        run: python3 scripts/probe_lcd_landscape.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify opt-in M4 GPIOA input voltage and output direction via ARM QMP
        run: python3 scripts/probe_gpioa_input.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify runtime M4 GPIOA input changes via ARM QMP
        run: python3 scripts/probe_gpioa_live_input.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify original M4 TPM0 IRQ38 drives overflow at genuine ARM-programmed MOD/SC
        run: python3 scripts/probe_m4_tpm0_irq.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify M4 PCTLA IRQ56 hardware edge with NVIC positive and negative controls
        run: python3 scripts/probe_m4_port_irq.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify ROM-keymap M4 keyboard row and column contacts via ARM QMP
        run: python3 scripts/probe_m4_key_matrix.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify genuine BIOS simultaneous startup chord via ARM GPIO MMIO
        run: python3 scripts/probe_startup_chord.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify LPTMR0 NVIC IRQ36 via synthetic ARM
        run: python3 scripts/probe_lptmr_m4_irq.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify persistent raw-backed QCOW2 VM snapshot in a second native QEMU process
        run: python3 scripts/probe_factory_snapshot.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify synthetic ARM DMA1 actual 32-byte copy and disabled negative control
        run: python3 scripts/probe_dma1_memcpy.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify M4 LPIT0 external IRQ33 (exception 49) from 12MHz CH1
        run: python3 scripts/probe_m4_lpit0_irq.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
      - name: Verify actual A7 LPIT1 GIC25 IRQ with real ARM negative/positive controls
        run: |
          python3 scripts/probe_lpit1_irq.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify NXP SNVS HP reset command and RTC enable from real ARM guest
        run: |
          python3 scripts/probe_snvs_hp.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_snvs_hp.py --diagnostic \
            --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Verify NXP DMA0 early-control registers using real ARM instructions
        run: |
          python3 scripts/probe_dma0.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Test actual A7-triggered Cortex-M4 ROM handoff
        run: |
          python3 scripts/probe_m4_handoff.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Differential test of default NACK vs scripted I2C slave with ARM guest
        run: |
          python3 scripts/probe_lpi2c4b.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Validate opt-in I2C4B register-mirror readback with ARM guest
        run: |
          python3 scripts/probe_i2c_register_mirror.py --qemu build/qemu-system-arm \
            --profile profiles/imx7ulp-early-boot.ini
      - name: Generate firmware-free CPU probe
        run: python3 scripts/make_probe.py build/cp15-probe.elf
      - name: Test probe layout
        run: python3 -m unittest discover -s tests -v
      - name: Execute privileged probe in native QEMU
        run: python3 scripts/test_qemu.py
      - name: Check factory auto-driver and on-demand real-ARM LCD capture
        run: |
          python3 -m py_compile scripts/auto_driver.py scripts/drive_ca05_factory_menu_nogdb.py scripts/factory_control_panel.py scripts/headless_factory_menu_checks.py
          python3 -m unittest discover -s tests -p test_factory_auto_driver.py -v
          python3 -m unittest discover -s tests -p test_factory_control_panel.py -v
          python3 scripts/probe_lcd_qmp.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_adc_conversion.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_i2s_sai.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_bu26154_touch.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_bu21029_touch.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_wlan_lpspi.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_wlan_packed.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_winc1510_tcp.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_winc1510_dma.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_usb_endpoint_bridge.py --qemu build/qemu-system-arm --profile profiles/imx7ulp-early-boot.ini
          python3 scripts/probe_factory_profile_backfill.py
          python3 scripts/probe_e2_cross_geometry.py
          python3 scripts/probe_e2_touch_ipc.py
          python3 scripts/check_original_touch_dispatch.py
      # Never expose owner binaries, URLs, MAC addresses or media to a
      # public PR runner. Only a maintainer-triggered dispatch with
      # access-controlled secrets can exercise unchanged owner firmware.
      - name: Original OSUP TEST MENU regression (maintainer private fixture)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          EXESX_PRIVATE_OSUP_URL: ${{ secrets.EXESX_PRIVATE_OSUP_URL }}
          EXESX_PRIVATE_OSUP_SHA256: ${{ secrets.EXESX_PRIVATE_OSUP_SHA256 }}
          EXESX_PRIVATE_ASSET_TOKEN: ${{ secrets.EXESX_PRIVATE_ASSET_TOKEN }}
        run: |
          if test -n "$EXESX_PRIVATE_OSUP_URL" && test -n "$EXESX_PRIVATE_OSUP_SHA256"; then
            python3 scripts/ci_private_osup_regression.py \
              --qemu build/qemu-system-arm \
              --profile profiles/imx7ulp-early-boot.ini
          else
            echo 'SKIP original ROM: configure private fixture URL and SHA-256 secrets'
          fi
      - name: Bundle tested native emulator
        run: |
          mkdir -p dist/exesx-qemu-linux-x86_64
          cp build/qemu-system-arm dist/exesx-qemu-linux-x86_64/
          mkdir -p dist/exesx-qemu-linux-x86_64/lib
          cp -L /usr/lib/x86_64-linux-gnu/libfdt.so.1 dist/exesx-qemu-linux-x86_64/lib/
          cp scripts/qemu-wrapper.sh dist/exesx-qemu-linux-x86_64/
          if test -f /usr/share/doc/libfdt1/copyright; then cp /usr/share/doc/libfdt1/copyright dist/exesx-qemu-linux-x86_64/LIBFDT-COPYRIGHT.txt; fi
          cp scripts/make_probe.py scripts/test_qemu.py scripts/prepare_osup.py scripts/run_firmware.py scripts/analyze_init_regions.py scripts/make_gdb_commands.py scripts/probe_profile.py scripts/fuzz_mmio.py scripts/probe_imx7ulp.py scripts/probe_m4_handoff.py scripts/recover_exesx.py scripts/probe_lpi2c4b.py scripts/analyze_lpi2c_trace.py scripts/probe_adc.py scripts/compare_i2c_boot.py scripts/prepare_i2c_ghidra.py scripts/decode_i2c_transactions.py scripts/i2c_boot_triage.py scripts/probe_gpio_ipc.py scripts/probe_i2c_register_mirror.py scripts/probe_i2c40_register_mirror.py scripts/probe_dma0.py scripts/analyze_a7_kernel_mu.py scripts/probe_mu_irq.py scripts/probe_mu_v1_channels.py scripts/probe_snvs_hp.py scripts/probe_a7_early_devices.py scripts/probe_usdhc1_no_media.py scripts/probe_upstream_emmc.py scripts/probe_usdhc1_clock_gate.py scripts/probe_snvs_hp_rtc.py scripts/probe_gpiob_input.py scripts/probe_a7_boot_gate.py scripts/run_osup.py scripts/analyze_osup_install_layout.py scripts/probe_postdma_handoff.py scripts/probe_ipc_1808.py scripts/probe_ipc_0804.py scripts/probe_gpioa_live_input.py scripts/summarize_lcd_screenshot.py scripts/probe_lcd_landscape.py scripts/probe_lcd_screenshot.py scripts/probe_lcd_qmp.py scripts/probe_adc_conversion.py scripts/lcd_qmp.py scripts/auto_driver.py scripts/factory_control_panel.py scripts/headless_factory_menu_checks.py scripts/drive_ca05_factory_menu_nogdb.py scripts/probe_gpioa_input.py scripts/probe_gpiob_input.py dist/exesx-qemu-linux-x86_64/
          # These tools intentionally operate only on owner-private firmware.
          cp scripts/drive_factory_menu.py scripts/drive_physical_menu_qmp.py scripts/probe_factory_snapshot.py scripts/probe_lptmr_m4_irq.py scripts/probe_m4_key_matrix.py scripts/probe_m4_port_irq.py scripts/probe_m4_tpm0_irq.py dist/exesx-qemu-linux-x86_64/
          cp build/exesx-memtrace.so dist/exesx-qemu-linux-x86_64/
          cp scripts/hmp_memory.py dist/exesx-qemu-linux-x86_64/
          # Ship the real opt-in WINC1510 TCP/HIF slave used by original-ROM tests.
          cp scripts/winc1510_spi_backend.py dist/exesx-qemu-linux-x86_64/
          cp -r profiles dist/exesx-qemu-linux-x86_64/
          cp build/cp15-probe.elf dist/exesx-qemu-linux-x86_64/
          cp docs/local-firmware.md dist/exesx-qemu-linux-x86_64/LOCAL-FIRMWARE.md
          git rev-parse HEAD > dist/exesx-qemu-linux-x86_64/SOURCE_COMMIT
          ldd build/qemu-system-arm > dist/exesx-qemu-linux-x86_64/LINKED_LIBRARIES.txt
          printf 'Ubuntu 24.04 x86_64; dynamically linked QEMU TCG (not WASM).\n' > dist/exesx-qemu-linux-x86_64/README.txt
          tar -C dist -czf dist/exesx-qemu-linux-x86_64.tar.gz exesx-qemu-linux-x86_64
          (cd dist && sha256sum exesx-qemu-linux-x86_64.tar.gz > SHA256SUMS)
      - name: Upload CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: exesx-qemu-native-${{ github.sha }}
          path: |
            dist/exesx-qemu-linux-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish rolling development release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-native >/dev/null 2>&1 || \
            gh release create dev-native --title "EXeSX native development build" \
              --notes "Research emulator. Native x86_64 Linux only; NOT firmware-boot validated." \
              --target "$GITHUB_SHA" --prerelease
          gh release upload dev-native dist/exesx-qemu-linux-x86_64.tar.gz dist/SHA256SUMS --clobber
      - name: Diagnose machine initialization with GDB when probe fails
        if: failure()
        run: |
          python3 scripts/make_probe.py build/cp15-probe.elf
          timeout 20s gdb -q -batch \
            -ex "set pagination off" -ex run -ex "frame 0" \
            -ex "p mr" -ex "p subregion->container" -ex "p subregion" \
            -ex "thread apply all bt 12" --args \
            build/qemu-system-arm -machine exesx -m 64M \
            -accel tcg -display none -serial none -monitor none \
            -device loader,file=build/cp15-probe.elf,cpu-num=0 || true
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exesx-build-logs-${{ github.run_id }}
          path: |
            build/meson-logs/meson-log.txt
            build/config.log
          if-no-files-found: ignore

  # Owner-only original-ROM end-to-end test, AFTER the latest Linux QEMU build.
  # Never expose private images or secrets to untrusted pull-request code.
  private-arm-pattern-e2e:
    needs: native-qemu
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/experiment/dy357-wlan-host-20261029' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Determine whether private fixture is configured
        id: fixture
        env:
          FIXTURE_URL: ${{ secrets.EXESX_PRIVATE_E2E_URL }}
          FIXTURE_SHA: ${{ secrets.EXESX_PRIVATE_E2E_SHA256 }}
        shell: bash
        run: |
          if [[ -z "$FIXTURE_URL" && -z "$FIXTURE_SHA" ]]; then
            echo "::notice::PRIVATE E2E SKIPPED - configure both private fixture secrets."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$FIXTURE_URL" || -z "$FIXTURE_SHA" ]]; then
            echo "::error::Both private E2E fixture URL and SHA256 secrets are required."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download freshly built Linux QEMU artifact
        if: steps.fixture.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: exesx-qemu-native-${{ github.sha }}
          path: ${{ runner.temp }}/native
      - name: Extract the Linux build from this workflow run
        if: steps.fixture.outputs.enabled == 'true'
        shell: bash
        run: |
          tar -xzf "$RUNNER_TEMP/native/exesx-qemu-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/native"
          chmod +x "$RUNNER_TEMP/native/exesx-qemu-linux-x86_64/qemu-system-arm"
          test "$(cat "$RUNNER_TEMP/native/exesx-qemu-linux-x86_64/SOURCE_COMMIT")" = "$GITHUB_SHA"
      - name: Fetch and authenticate owner-private boot fixture
        if: steps.fixture.outputs.enabled == 'true'
        env:
          FIXTURE_URL: ${{ secrets.EXESX_PRIVATE_E2E_URL }}
          FIXTURE_SHA: ${{ secrets.EXESX_PRIVATE_E2E_SHA256 }}
          FIXTURE_TOKEN: ${{ secrets.EXESX_PRIVATE_ASSET_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, urllib.request, zipfile
          url = os.environ["FIXTURE_URL"]
          sha = os.environ["FIXTURE_SHA"].strip().lower()
          if not url.startswith("https://") or not re.fullmatch(r"[0-9a-f]{64}", sha):
              raise SystemExit("private fixture must be HTTPS and have SHA256")
          headers = {"User-Agent": "EXeSX-private-arm-pattern-e2e"}
          if os.environ.get("FIXTURE_TOKEN"):
              headers["Authorization"] = "Bearer " + os.environ["FIXTURE_TOKEN"]
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "private-e2e.zip"
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=90) as inp, path.open("wb") as out:
              while chunk := inp.read(1024 * 1024):
                  size += len(chunk)
                  if size > 256 * 1024 * 1024:
                      raise SystemExit("private fixture exceeds max download size")
                  digest.update(chunk)
                  out.write(chunk)
          if size < 1024 or digest.hexdigest() != sha:
              path.unlink(missing_ok=True)
              raise SystemExit("private fixture SHA256 mismatch")
          dest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "private-e2e"
          dest.mkdir()
          with zipfile.ZipFile(path) as archive:
              # Extract only known fixture inputs; never trust arbitrary ZIP paths.
              prefix = "EXeSX-private-E2E-fixture/"
              approved = {"OSUP.BIN", "a7-bios-os.elf", "emmc-data-extents.bin",
                          "reconstruct_media.py", "manifest.json"}
              if not approved.issubset({n[len(prefix):] for n in archive.namelist() if n.startswith(prefix)}):
                  raise SystemExit("private fixture missing required members")
              for member in approved:
                  item = archive.getinfo(prefix + member)
                  if item.file_size > 128 * 1024 * 1024:
                      raise SystemExit("private fixture member too large")
                  with archive.open(item) as inp, (dest / member).open("wb") as out:
                      while chunk := inp.read(1024 * 1024):
                          out.write(chunk)
          path.unlink()
          print("Owner-private fixture integrity verified; input files extracted outside checkout.")
          PY
      - name: Reconstruct and verify disposable boot media
        if: steps.fixture.outputs.enabled == 'true'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/private-e2e"
          python3 - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path("manifest.json").read_text())
          for filename in ("OSUP.BIN", "a7-bios-os.elf", "emmc-data-extents.bin"):
              source = pathlib.Path(filename)
              assert hashlib.sha256(source.read_bytes()).hexdigest() == manifest["images"][filename]["sha256"], filename
          print("Verified firmware and packed media against internal fixture manifest.")
          PY
          python3 reconstruct_media.py
